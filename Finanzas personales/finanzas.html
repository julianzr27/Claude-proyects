<title>Libro de finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="appcss">
*{box-sizing:border-box;margin:0}
:root{
  --bg:#f2f4f2; --surface:#ffffff; --surface-2:#ecefec; --surface-3:#e3e7e3;
  --ink:#1a1c1a; --ink-2:#585e58; --ink-3:#878e87;
  --line:#e0e4e0; --line-2:#ccd2cc;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#e2efea;
  --pos:#177544; --neg:#b23a2b; --warn:#8f6410; --warn-soft:#f5ead2;
  --c1:#0d6b57;--c2:#2f6f9f;--c3:#6b5b95;--c4:#8e4b6e;--c5:#b23a2b;--c6:#a9761a;--c7:#6c7a37;--c8:#3f8f5b;--c9:#5a6a75;
  --radius:11px;
  --shadow:0 1px 2px rgba(20,32,26,.05),0 3px 10px rgba(20,32,26,.05);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
}
:root:not([data-theme="light"]){ color-scheme:light dark; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121410; --surface:#1b1e19; --surface-2:#232722; --surface-3:#2b302a;
    --ink:#e9ece7; --ink-2:#a4aca2; --ink-3:#79817896;
    --line:#2d322c; --line-2:#3b423a;
    --accent:#41b09b; --accent-ink:#081915; --accent-soft:#16302a;
    --pos:#4dbb7c; --neg:#e2725f; --warn:#d3a24d; --warn-soft:#2f2717;
    --c1:#3fae9a;--c2:#5a97c4;--c3:#9384be;--c4:#b7789b;--c5:#dd6c5b;--c6:#d0a04a;--c7:#9aa863;--c8:#63bd83;--c9:#8b9aa5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121410; --surface:#1b1e19; --surface-2:#232722; --surface-3:#2b302a;
  --ink:#e9ece7; --ink-2:#a4aca2; --ink-3:#79817896;
  --line:#2d322c; --line-2:#3b423a;
  --accent:#41b09b; --accent-ink:#081915; --accent-soft:#16302a;
  --pos:#4dbb7c; --neg:#e2725f; --warn:#d3a24d; --warn-soft:#2f2717;
  --c1:#3fae9a;--c2:#5a97c4;--c3:#9384be;--c4:#b7789b;--c5:#dd6c5b;--c6:#d0a04a;--c7:#9aa863;--c8:#63bd83;--c9:#8b9aa5;
}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;text-wrap:balance}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}

/* minmax(0,1fr) y no 1fr: si no, el mínimo de contenido ensancha la columna
   y la página se desborda a lo ancho en pantallas angostas */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:1.15rem;font-weight:700;padding:4px 10px 16px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.navlink{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.92rem}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlink .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.railfoot{margin-top:auto;padding:10px;font-size:.74rem;color:var(--ink-3);display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-2)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.chip.ok::before{background:var(--pos)} .chip.busy::before{background:var(--warn)} .chip.err::before{background:var(--neg)} .chip.off::before{background:var(--ink-3)}

main{padding:26px 30px 60px;max-width:1120px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:1.5rem}
.monthsel{display:flex;align-items:center;gap:8px}
select.month{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:.85rem}

.tiles{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.tile .lbl{margin-bottom:9px}
.tile .big{font-family:var(--serif);font-weight:600;font-size:2.35rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.8rem;color:var(--ink-2);margin-top:5px}
.tile.hero{background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.delta{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.8rem;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--surface-2)}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)}
.val.pos{color:var(--pos)} .val.neg{color:var(--neg)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h2{font-size:1.05rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 .aside{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);font-weight:400}
/* sin esto las filas flex no se encogen y desbordan en pantallas angostas.
   Acotado a los hijos directos: la tabla necesita conservar su max-content. */
.panel{min-width:0}
.panel>div{min-width:0}
.panel>div>span{min-width:0;overflow-wrap:anywhere}

.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.83rem;min-width:150px;flex:1}
.legend .row{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{color:var(--ink-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .vl{font-family:var(--mono);font-variant-numeric:tabular-nums}

.bars{display:flex;gap:9px;align-items:flex-end;height:128px;border-bottom:1px solid var(--line-2);padding-bottom:0}
.bargroup{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%}
.bar{flex:1;border-radius:3px 3px 0 0;min-height:2px;background:var(--surface-3)}
.bar.in{background:var(--pos)} .bar.out{background:var(--neg)}
.barlabels{display:flex;gap:9px;margin-top:6px}
.barlabels span{flex:1;text-align:center;font-size:.72rem;color:var(--ink-3);font-family:var(--mono)}

.tblwrap{overflow-x:auto} /* la tabla scrollea dentro del panel, nunca la página */
.tblwrap table{min-width:max-content}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.74rem;background:var(--surface-2);color:var(--ink-2)}
.rowbtn{background:none;border:0;color:var(--ink-3);padding:3px 6px;border-radius:6px}
.rowbtn:hover{background:var(--surface-2);color:var(--ink)}
.thumb{width:30px;height:30px;object-fit:cover;border-radius:5px;border:1px solid var(--line-2);vertical-align:middle;cursor:zoom-in}

.formcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.grow{flex:1;min-width:150px}
.fld label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line-2);border-radius:7px;padding:8px 9px;min-width:110px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hint{font-size:.78rem;color:var(--ink-3);margin-top:8px}

.empty{text-align:center;color:var(--ink-3);padding:30px 10px;font-size:.9rem}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;gap:12px}
.sectionhead h2{font-size:1.1rem}

.modalbg{position:fixed;inset:0;background:rgba(15,20,17,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;max-width:840px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:1.2rem;margin-bottom:6px}
.modal .sub{color:var(--ink-2);font-size:.86rem;margin-bottom:16px}
.rev{width:100%;font-size:.84rem}
.rev td{padding:7px 6px}
.rev input,.rev select{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:5px 6px;width:100%}
.rev input.amt{font-family:var(--mono);text-align:right}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.msg{padding:10px 12px;border-radius:8px;font-size:.85rem;margin-bottom:12px}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.err{background:#fbe9e6;color:var(--neg)}
:root[data-theme="dark"] .msg.err,:root:not([data-theme="light"]) .msg.err{background:#3a201c}
.due{font-family:var(--mono);font-size:.8rem}
.due.soon{color:var(--warn)} .due.now{color:var(--neg);font-weight:600}

.donut{width:128px;height:128px;flex:none}
.donut [data-act="filtro"]:hover{filter:brightness(1.15)}
.donut :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend .row.clic{cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.legend .row.clic:hover{background:var(--surface-2)}
.legend .row.on{background:var(--accent-soft)}
.legend .row.on .nm{color:var(--accent);font-weight:600}
.filtro{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);
  border-radius:20px;padding:4px 6px 4px 12px;font-size:.82rem;margin-bottom:14px}
.filtro .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.filtro .val{font-weight:600}
.filtro .rowbtn{color:var(--accent)}

/* Las cifras en COP no se pueden partir: por debajo de esto, cuatro tiles
   en fila desbordan. Mejor dos filas de dos que scroll horizontal. */
@media (max-width:1300px){
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tile .big{font-size:2.1rem}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .brand{display:none}
  .railfoot{margin:0;flex-direction:row;align-items:center;padding:0 0 0 6px}
  .navlink{white-space:nowrap}
  main{padding:18px 16px 50px}
  .tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:430px){ /* celular en vertical */
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tile .big{font-size:1.9rem}
  main{padding:16px 12px 50px}
  /* la dona y su leyenda lado a lado no caben: se apilan */
  .donutwrap{gap:12px;flex-direction:column;align-items:flex-start}
  .legend{min-width:0;width:100%}
  .fld,.fld.grow{flex:1 1 100%;min-width:0}
  .fld input,.fld select{min-width:0;width:100%}
  .formrow .btn{flex:1 1 100%}
}
@media (max-width:360px){ /* pantallas muy angostas: una cifra de 8 dígitos no cabe a 1.9rem */
  .tile .big{font-size:1.55rem}
}
</style>

<div id="app"></div>
<script type="application/json" id="datos">{"seed":true}</script>
<script id="appjs">
"use strict";
(function(){
const CATS=["Mercado","Transporte","Vivienda","Servicios","Salud","Ocio","Educación","Suscripciones","Otros"];
const CCOL={Mercado:"var(--c1)",Transporte:"var(--c2)",Vivienda:"var(--c3)",Salud:"var(--c4)",Ocio:"var(--c5)",Servicios:"var(--c6)",Educación:"var(--c7)",Suscripciones:"var(--c8)",Otros:"var(--c9)"};
const INVCOL={accion:"var(--c2)",cuenta:"var(--c1)",cdt:"var(--c6)",efectivo:"var(--c7)"};
const INVLBL={accion:"Acciones",cuenta:"Cuentas",cdt:"CDT",efectivo:"Efectivo"};
const fmt=new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
const fmt2=new Intl.NumberFormat("es-CO",{maximumFractionDigits:1});
const fmtTasa=new Intl.NumberFormat("es-CO",{maximumFractionDigits:2}); // 9,25% no debe verse como 9,3%
const fmtUSD=new Intl.NumberFormat("es-CO",{style:"currency",currency:"USD",maximumFractionDigits:2});
const fmtMon=(v,i)=>esUSD(i)?fmtUSD.format(v):fmt.format(v);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,"0");
const dISO=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); // fecha LOCAL, no UTC
const dYM=d=>d.getFullYear()+"-"+p2(d.getMonth()+1);
const todayISO=()=>dISO(new Date());
const mkey=d=>String(d).slice(0,7);
const nowMonth=()=>dYM(new Date());
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mesNombre=mk=>MESES[+mk.slice(5,7)-1]||mk;

// ---- state ----
let state=defaults();
function defaults(){return{v:1,config:{moneda:"COP",trm:0,trmFecha:"",trmConfirmada:false},tarjetas:[],inversiones:[],movimientos:[]};}
function load(){
  try{
    const raw=JSON.parse($("#datos").textContent);
    if(raw&&!raw.seed&&Array.isArray(raw.movimientos)){
      state=Object.assign(defaults(),raw);
      // config se fusiona, no se reemplaza: datos guardados antes de la TRM
      // llegan sin ella y dejarían la conversión a dólares en cero.
      state.config=Object.assign(defaults().config,raw.config||{});
      state.tarjetas||=[];state.inversiones||=[];state.movimientos||=[];
      migrarInversiones();
    }
  }catch(e){console.warn("datos ilegibles",e);}
}
// Las cuentas y CDT pasaron de "invertido/valor actual" a "saldo + tasa E.A.".
// Convierte los registros viejos para que nada quede en cero.
function migrarInversiones(){
  state.inversiones.forEach(i=>{
    if(i.tipo!=="cuenta"&&i.tipo!=="cdt")return;
    if(i.saldo!==undefined)return; // ya migrada
    i.saldo=+i.valorActual||0;
    i.aportado=+i.montoInvertido||i.saldo;
    i.interesAcumulado=Math.max(0,i.saldo-i.aportado);
    i.tasaEA=+i.tasaEA||0;
    i.fechaSaldo=i.fechaActualizacion||todayISO();
    delete i.valorActual;delete i.montoInvertido;
  });
  // Las acciones registradas antes no tenían cantidad: el valor guardado era el total.
  state.inversiones.forEach(i=>{if(i.tipo==="accion"&&!(+i.cantidad>0))i.cantidad=1;});
  // "cuenta" y "efectivo" eran etiquetas genéricas; ahora el medio apunta a una
  // posición real. Lo genérico pasa a «sin especificar» para no mover saldos ajenos.
  const hayEfectivo=state.inversiones.some(i=>i.id===ID_EFECTIVO);
  state.movimientos.forEach(m=>{
    if(m.medio==="cuenta")delete m.medio;
    if(m.medio==="efectivo"&&!hayEfectivo)delete m.medio;
  });
}
// La sección y el mes viven en sessionStorage: al guardar, el visor recarga
// la página con la versión nueva, y sin esto siempre caerías en Resumen.
const ui={section:"resumen",month:nowMonth(),editId:null,mesElegido:false,
  filtro:{cat:null,inv:null}}; // cat: categoría de gasto/ingreso · inv: tipo de inversión
try{const s=JSON.parse(sessionStorage.getItem("ui-finanzas")||"null");
  if(s&&s.section)ui.section=s.section;
  // Solo se respeta el mes guardado si Julián lo eligió a mano. Si venía del
  // valor por defecto, manda el mes de hoy: si no, al cambiar de mes con la
  // pestaña abierta el dashboard se quedaría mostrando el mes anterior.
  if(s&&s.mesElegido&&/^\d{4}-\d{2}$/.test(s.month||"")){ui.month=s.month;ui.mesElegido=true;}
}catch(e){}
function saveUi(){try{sessionStorage.setItem("ui-finanzas",JSON.stringify({section:ui.section,month:ui.month,mesElegido:ui.mesElegido}));}catch(e){}}

// ---- persistence via artifact capability ----
const HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Libro de finanzas</title>'
 +'<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
 +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">';
function renderDoc(){
  const css=document.getElementById("appcss").outerHTML;
  const js=document.getElementById("appjs").outerHTML;
  const data=JSON.stringify(state).replace(/<\//g,"<\\/");
  return "<!doctype html><html lang=\"es\"><head>"+HEAD+css+"</head><body><div id=\"app\"></div>"
    +"<script type=\"application/json\" id=\"datos\">"+data+"<\/script>"+js+"</body></html>";
}
const cap=n=>(typeof claude!=="undefined"&&claude&&claude.use)?claude.use(n).catch(()=>null):Promise.resolve(null);
let artifactNS=undefined, saveMode="pending", saveT=null, retried=false, dirty=false;
function setChip(cls,txt){const c=$("#savechip");if(c){c.className="chip "+cls;c.textContent=txt;}}
function scheduleSave(){
  dirty=true;
  if(saveMode==="off"){setChip("off","Solo esta sesión");return;}
  setChip("busy","Guardando…");
  clearTimeout(saveT);
  saveT=setTimeout(flush,1400);
}
async function flush(){
  clearTimeout(saveT);
  if(!dirty)return; // nunca publicar sin cambios: gastaría una versión por cada apertura
  if(artifactNS===undefined) artifactNS=await cap("artifact");
  if(!artifactNS){saveMode="off";setChip("off","Solo esta sesión");return;}
  try{
    const html=renderDoc();
    await artifactNS.publish(html);
    dirty=false;saveMode="on";retried=false;setChip("ok","Guardado");
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict") return; // shell reloads to winner
    if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"){
      saveMode="off";setChip("off","Solo esta sesión");return;
    }
    if(code==="rate_limited"){setChip("busy","Guardando…");clearTimeout(saveT);saveT=setTimeout(flush,4000);return;}
    if(!retried){retried=true;clearTimeout(saveT);saveT=setTimeout(flush,2500);setChip("busy","Reintentando…");return;}
    setChip("err","Error al guardar");
  }
}
function commit(){ render(); scheduleSave(); }
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush();});
addEventListener("beforeunload",()=>{try{flush();}catch(e){}});

// ---- capabilities: mcp (Gmail), downloads ----
let mcpNS=undefined, dlNS=undefined;
async function initCaps(){
  mcpNS=await cap("mcp");
  dlNS=await cap("downloads");
  render();
  if(artifactNS===undefined){artifactNS=await cap("artifact");
    if(!artifactNS){saveMode="off";setChip("off","Solo esta sesión");} else {saveMode="on";setChip("ok","Guardado");}
  }
}

// ---- money helpers ----
const inMonth=(m,mk)=>mkey(m.fecha)===mk;
const gastosDe=mk=>state.movimientos.filter(m=>m.tipo==="gasto"&&inMonth(m,mk));
const ingresosDe=mk=>state.movimientos.filter(m=>m.tipo==="ingreso"&&inMonth(m,mk));
const sum=a=>a.reduce((s,m)=>s+(+m.monto||0),0);
const mkDate=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m-1,1);}; // 1º del mes, hora local
const prevMonth=mk=>{const d=mkDate(mk);d.setMonth(d.getMonth()-1);return dYM(d);};
// ---- renta fija (cuentas y CDT) ----
// El saldo confirmado + la tasa E.A. dan una estimación del valor de hoy.
// Es estimación, no verdad: entre actualizaciones la cuenta puede haberse movido.
const esFija=i=>i.tipo==="cuenta"||i.tipo==="cdt"||i.tipo==="efectivo";
const diaISO=s=>{const[y,m,d]=String(s||"").split("-").map(Number);return (y&&m&&d)?new Date(y,m-1,d):null;}; // local, no UTC
function diasEntre(desdeISO,hastaDate){
  const a=diaISO(desdeISO); if(!a)return 0;
  const b=hastaDate||new Date(); b.setHours(0,0,0,0);
  return Math.max(0,Math.round((b-a)/86400000));
}
// valor de un capital a tasa efectiva anual tras n días
const capitaliza=(capital,tasaEA,dias)=>capital*Math.pow(1+(+tasaEA||0)/100,dias/365);

// ---- movimientos que tocan una cuenta ----
// El saldo confirmado es el ancla; todo lo registrado después se suma encima.
// Así hay una sola regla y nada descuenta dos veces.
const ID_EFECTIVO="efectivo";
const esCuenta=i=>i.tipo==="cuenta"||i.tipo==="efectivo"; // de donde sale y entra plata
// Un movimiento ya está dentro del saldo confirmado si ocurrió antes de la fecha
// del ancla, o si se registró antes de confirmarlo. Hace falta lo segundo porque
// un gasto de hoy y un saldo de hoy no se distinguen solo por fecha.
function movNeto(id,desdeISO,anclaTs){
  const corte=diaISO(desdeISO);
  return state.movimientos.reduce((s,m)=>{
    if(corte&&diaISO(m.fecha)&&diaISO(m.fecha)<corte)return s;
    if(anclaTs&&m.ts&&m.ts<=anclaTs)return s;
    const v=+m.monto||0;
    if(m.tipo==="traslado")return s+(m.hacia===id?v:0)-(m.desde===id?v:0);
    if(m.tipo==="ingreso"&&m.medio===id)return s+v;
    if(m.tipo==="gasto"&&m.medio===id)return s-v;      // un gasto con tarjeta no entra: su medio es la tarjeta
    if(m.tipo==="pago_tarjeta"&&m.desde===id)return s-v;
    return s;
  },0);
}
function billeteraEfectivo(){ // se crea sola la primera vez que se necesita
  let b=state.inversiones.find(i=>i.id===ID_EFECTIVO);
  if(!b){b={id:ID_EFECTIVO,nombre:"Efectivo",tipo:"efectivo",saldo:0,fechaSaldo:todayISO(),aportado:0,interesAcumulado:0,anclaTs:0};
    state.inversiones.push(b);}
  return b;
}
// Para pagar el día a día solo sirven las cuentas en pesos y el efectivo;
// una posición en dólares es inversión, no medio de pago.
const cuentasDisponibles=()=>state.inversiones.filter(c=>esCuenta(c)&&!esUSD(c));
// Los traslados alcanzan a todo lo que lleva saldo: incluye el CDT, porque al
// vencer la plata vuelve a una cuenta y eso es un movimiento, no una ganancia.
const cuentasParaTraslado=()=>state.inversiones.filter(esFija);
// ponytail: el interés se calcula sobre el saldo anclado, ignorando los movimientos
// del periodo. Se corrige al confirmar el saldo real; si algún día importa la
// precisión intermedia, habría que capitalizar día a día sobre el saldo corriente.
function interesCausado(i){ // interés estimado desde el último saldo confirmado
  if(!esFija(i))return 0;
  const hasta=i.vencimiento&&diaISO(i.vencimiento)<new Date()?diaISO(i.vencimiento):null; // un CDT deja de causar al vencer
  const dias=hasta?diasEntre(i.fechaSaldo,hasta):diasEntre(i.fechaSaldo);
  return capitaliza(+i.saldo||0,i.tasaEA,dias)-(+i.saldo||0);
}
// ---- posiciones en dólares ----
// Se guardan en su moneda y una sola TRM las convierte a pesos para los totales.
// Así se distingue lo que rindió el activo de lo que se movió el dólar.
// Nunca se inventa una TRM. Mientras Julián no confirme la de hoy, se usa la
// del último dólar que realmente compró: así el efecto cambiario sale en cero
// en vez de fabricar una ganancia contra un número arbitrario.
function TRM(){
  const c=state.config.trmConfirmada?(+state.config.trm||0):0;
  if(c>0)return c;
  for(let k=state.inversiones.length-1;k>=0;k--){
    const i=state.inversiones[k], base=(+i.aportado||+i.montoInvertido||0);
    if(i.moneda==="USD"&&(+i.aportadoCOP)>0&&base>0)return i.aportadoCOP/base; // sin helpers: evita recursión
  }
  return 1;
}
const trmPendiente=()=>state.inversiones.some(esUSD)&&!state.config.trmConfirmada;
const esUSD=i=>i&&i.moneda==="USD";
const aCOP=(v,i)=>esUSD(i)?v*TRM():v;
// los movimientos se registran en pesos; para una posición en dólares se convierten
function movNetoNativo(i){const c=movNeto(i.id,i.fechaSaldo,i.anclaTs);return esUSD(i)?c/TRM():c;}

// valor en la moneda de la posición: ancla + interés + lo movido desde entonces
function valorNativo(i){return esFija(i)?(+i.saldo||0)+interesCausado(i)+movNetoNativo(i):(+i.valorActual||0);}
function aportadoNativo(i){return esFija(i)?(+i.aportado||0)+movNetoNativo(i):(+i.montoInvertido||0);}
// lo que vale hoy, siempre en pesos, que es la moneda de los totales
function valorHoy(i){return aCOP(valorNativo(i),i);}
// capital puesto: para una posición en dólares son los pesos que realmente salieron
function aportadoDe(i){
  if(esUSD(i))return (+i.aportadoCOP||0)+(esFija(i)?movNeto(i.id,i.fechaSaldo,i.anclaTs):0);
  return aportadoNativo(i);
}
// lo ganado por el activo, en su propia moneda
function interesTotal(i){return esFija(i)?(+i.interesAcumulado||0)+interesCausado(i):(+i.valorActual||0)-(+i.montoInvertido||0);}
// ganancia partida en dos: la del activo y la que aportó el movimiento del dólar
function gananciaActivoCOP(i){return aCOP(valorNativo(i)-aportadoNativo(i),i);}
function efectoDolar(i){return esUSD(i)?(valorHoy(i)-aportadoDe(i))-gananciaActivoCOP(i):0;}
// Rentabilidad llevada a base anual, para poder compararla con la tasa E.A. de
// una cuenta o un CDT. Sin fecha de compra no hay periodo y no se puede anualizar.
const cantidadDe=i=>(+i.cantidad>0?+i.cantidad:1);
const precioDe=i=>(+i.valorActual||0)/cantidadDe(i);
const precioCompraDe=i=>(+i.montoInvertido||0)/cantidadDe(i);
function anualizado(i){
  const inv=+i.montoInvertido||0, act=+i.valorActual||0;
  if(!i.fechaCompra||inv<=0||act<=0)return null;
  const dias=diasEntre(i.fechaCompra);
  if(dias<30)return null; // en pocos días la anualización se dispara y engaña
  return (Math.pow(act/inv,365/dias)-1)*100;
}
function valorAlVencimiento(i){
  if(i.tipo!=="cdt"||!i.vencimiento)return null;
  return capitaliza(+i.saldo||0,i.tasaEA,diasEntre(i.fechaSaldo,diaISO(i.vencimiento)));
}
const diasSinConfirmar=i=>esFija(i)?diasEntre(i.fechaSaldo):diasEntre(i.fechaActualizacion);
const DESACTUALIZADA=30;
// Plata disponible para pagar tarjetas: cuentas de ahorro. Un CDT no cuenta,
// está inmovilizado hasta el vencimiento.
const liquidez=()=>sum(cuentasDisponibles().map(i=>({monto:valorHoy(i)})));

function patrimonio(){return sum(state.inversiones.map(i=>({monto:valorHoy(i)})))-sum(state.tarjetas.map(t=>({monto:t.saldo})));}
// La última fecha de corte que ya pasó. Lo comprado hasta ahí está facturado
// y se paga en el próximo pago; lo posterior queda para el pago siguiente.
function ultimoCorte(t){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  let d=new Date(hoy.getFullYear(),hoy.getMonth(),+t.diaCorte||1);
  if(d>hoy)d=new Date(hoy.getFullYear(),hoy.getMonth()-1,+t.diaCorte||1);
  return d;
}
// Parte el saldo de una tarjeta en lo que se paga ya y lo que va para el
// siguiente ciclo. Los abonos se aplican primero a lo ya facturado.
function tarjetaCiclos(t){
  const corte=ultimoCorte(t);
  let facturado=+t.saldoInicial||0, enCurso=+t.saldoSinFacturar||0, pagos=0;
  state.movimientos.forEach(m=>{
    if(m.medio!==t.id)return;
    const v=+m.monto||0;
    if(m.tipo==="gasto"){const f=diaISO(m.fecha); if(f&&f>corte)enCurso+=v; else facturado+=v;}
    else if(m.tipo==="pago_tarjeta")pagos+=v;
  });
  const aFacturado=Math.min(pagos,facturado);
  facturado-=aFacturado; enCurso-=(pagos-aFacturado);
  return {corte,facturado,enCurso,total:facturado+enCurso};
}
function tarjetaSaldos(){ // recompute from movimientos so imports/edits stay consistent
  const s={};state.tarjetas.forEach(t=>s[t.id]=tarjetaCiclos(t).total);
  return s;
}
function syncSaldos(){const s=tarjetaSaldos();state.tarjetas.forEach(t=>t.saldo=Math.round(s[t.id]||0));}
function nextPayDate(day){const t=new Date();t.setHours(0,0,0,0);let d=new Date(t.getFullYear(),t.getMonth(),day);if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,day);return d;}
// el pago del ciclo en curso cae un mes después del próximo
function pagoSiguiente(day){const d=nextPayDate(day);return new Date(d.getFullYear(),d.getMonth()+1,day);}
const daysUntil=d=>Math.round((d-new Date().setHours(0,0,0,0))/86400000);

// ---- charts ----
// Dona en SVG y no en conic-gradient, porque cada porción tiene que ser
// clicable para filtrar. `campo` la vuelve interactiva; sin él solo dibuja.
function donut(parts,campo){
  const tot=parts.reduce((s,p)=>s+p.v,0);
  const R=64,r=39,cx=64,cy=64,act=campo?ui.filtro[campo]:null;
  const anillo=c=>'<circle cx="64" cy="64" r="'+((R+r)/2)+'" fill="none" stroke="'+c+'" stroke-width="'+(R-r)+'"/>';
  if(!tot) return '<svg class="donut" viewBox="0 0 128 128" aria-hidden="true">'+anillo("var(--surface-3)")+'</svg>';
  const vivos=parts.filter(p=>p.v>0);
  const attrs=p=>campo?' data-act="filtro" data-campo="'+campo+'" data-valor="'+esc(p.n)+'" style="cursor:pointer'
      +(act&&act!==p.n?';opacity:.28':"")+'" tabindex="0" role="button" aria-label="Filtrar por '+esc(p.n)+'"':"";
  // una sola porción no se puede dibujar como arco: el inicio y el fin coinciden
  if(vivos.length===1) return '<svg class="donut" viewBox="0 0 128 128">'
    +'<g'+attrs(vivos[0])+'>'+anillo(vivos[0].c)+'</g></svg>';
  let a0=-Math.PI/2;
  const pt=(a,rad)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
  const arcos=vivos.map(p=>{
    const a1=a0+p.v/tot*2*Math.PI, grande=(a1-a0)>Math.PI?1:0;
    const[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
    a0=a1;
    return '<path d="M'+x0+' '+y0+'A'+R+' '+R+' 0 '+grande+' 1 '+x1+' '+y1
      +'L'+x2+' '+y2+'A'+r+' '+r+' 0 '+grande+' 0 '+x3+' '+y3+'Z" fill="'+p.c+'"'+attrs(p)+'></path>';
  }).join("");
  return '<svg class="donut" viewBox="0 0 128 128">'+arcos+'</svg>';
}
function legend(parts,campo,fmtV){
  const tot=parts.reduce((s,p)=>s+p.v,0)||1, act=campo?ui.filtro[campo]:null;
  const F=fmtV||(v=>fmt.format(v));
  return '<div class="legend">'+parts.filter(p=>p.v>0).map(p=>
    '<div class="row'+(campo?" clic":"")+(act===p.n?" on":"")+'"'
    +(campo?' data-act="filtro" data-campo="'+campo+'" data-valor="'+esc(p.n)+'" tabindex="0" role="button"':"")+'>'
    +'<span class="sw" style="background:'+p.c+'"></span><span class="nm">'+esc(p.n)+'</span>'
    +'<span class="vl">'+F(p.v)+'</span><span class="vl" style="color:var(--ink-3)">'+(p.v/tot*100).toFixed(0)+'%</span></div>').join("")+'</div>';
}
// Cinta que muestra el filtro activo y permite quitarlo
function chipFiltro(campo,etiqueta){
  const v=ui.filtro[campo]; if(!v)return "";
  return '<div class="filtro"><span class="lbl">'+esc(etiqueta)+'</span><span class="val">'+esc(v)+'</span>'
    +'<button class="rowbtn" data-act="quitarfiltro" data-campo="'+campo+'" aria-label="Quitar filtro">✕</button></div>';
}

  const ing=sum(ingresosDe(mk)), gasTotal=sum(todosGastos), gas=sum(gastosF), bal=ing-gasTotal;
  const tasa=ing?bal/ing*100:0;
  const activos=sum(state.inversiones.map(i=>({monto:valorHoy(i)})));
  const deudas=sum(state.tarjetas.map(t=>({monto:t.saldo})));
  const pat=activos-deudas;
  const catParts=CATS.map(c=>({n:c,c:CCOL[c],v:sum(gastosDe(mk).filter(m=>m.categoria===c))}));
  const invInv=sum(state.inversiones.map(i=>({monto:aportadoDe(i)}))), invVal=sum(state.inversiones.map(i=>({monto:valorHoy(i)})));

     +'<div class="sub"><span class="delta up">'+fmt.format(activos)+'</span> en activos · <span class="delta '+(deudas?"down":"")+'">'+fmt.format(deudas)+'</span> en tarjetas</div></div>'
   +tile("Ingresos de "+mesNombre(mk),fmt.format(ing))
   +tile("Gastos de "+mesNombre(mk)+(fCat?" · "+fCat:""),fmt.format(gas),(gas>=gPrev?"+":"−")+fmt.format(Math.abs(gas-gPrev))+" vs mes previo")
   +(fCat // con un filtro puesto, ingresos menos un gasto parcial no es un balance
     ?tile("Peso en el gasto del mes",(gasTotal?fmt2.format(gas/gasTotal*100):"0")+"%","de "+fmt.format(gasTotal)+" gastados")
     :tile("Balance / ahorro",fmt.format(bal),fmt2.format(tasa)+"% de tasa de ahorro",bal>=0?"pos":"neg"))
  +'</div>'

     +'<div class="donutwrap">'+donut(catParts,"cat")+legend(catParts,"cat")+'</div></div>'
   +'<div class="panel"><h2>Ingresos vs gastos <span class="aside">6 meses</span></h2>'
     +'<div class="bars">'+tr.map(t=>'<div class="bargroup" title="'+t.k+'"><div class="bar in" style="height:'+(t.in/mx*100)+'%"></div><div class="bar out" style="height:'+(t.out/mx*100)+'%"></div></div>').join("")+'</div>'
     +'<div class="barlabels">'+tr.map(t=>'<span>'+t.k.slice(5)+'</span>').join("")+'</div>'
     +'<div class="hint"><span style="color:var(--pos)">■</span> ingresos &nbsp; <span style="color:var(--neg)">■</span> gastos</div></div>'

     +(state.tarjetas.length?state.tarjetas.map(t=>{const nd=nextPayDate(t.diaPago),du=daysUntil(nd);
        return row2(esc(t.nombre),fmt.format(saldos[t.id]||0)+' <span class="due '+(du<=2?"now":du<=7?"soon":"")+'">· pago en '+du+'d</span>');}).join("")
       :'<div class="hint">Sin tarjetas registradas.</div>')

function vGastos(){

// Mover plata entre cuentas propias. No es gasto ni ingreso: la plata sigue
// siendo tuya, solo cambia de sitio. Retirar efectivo es un traslado más.
function moverPlata(){
  const cuentas=cuentasParaTraslado();
  if(cuentas.length<1){modal('<h2>Mover plata</h2><div class="msg warn">Primero registra al menos una cuenta en Inversiones.</div><div class="acts"><button class="btn ghost" data-act="closemodal">Cerrar</button></div>');return;}
  const opts=sel=>cuentas.map(c=>'<option value="'+c.id+'"'+(sel===c.id?" selected":"")+'>'+esc(c.nombre)+' · '+fmt.format(valorHoy(c))+'</option>').join("");
  const hayEfectivo=cuentas.some(c=>c.id===ID_EFECTIVO);
  modal('<h2>Mover plata</h2>'
   +'<p class="sub">Entre tus propias cuentas. No cuenta como gasto ni como ingreso.</p>'
   +'<div class="formrow">'
    +fld("Sale de",'<select id="tr-desde">'+opts(cuentas[0].id)+'</select>',"grow")
    +fld("Entra a",'<select id="tr-hacia">'+opts(cuentas[1]?cuentas[1].id:cuentas[0].id)
      +(hayEfectivo?"":'<option value="'+ID_EFECTIVO+'">Efectivo (retiro)</option>')+'</select>',"grow")
    +fld("Monto",'<input class="num" id="tr-monto" inputmode="numeric" value="">')
    +fld("Fecha",'<input type="date" id="tr-fecha" value="'+todayISO()+'">')
   +'</div>'
   +'<div class="msg warn" id="tr-aviso" style="margin-top:12px"></div>'
   +'<div class="acts"><button class="btn ghost" data-act="closemodal">Cancelar</button><button class="btn" id="tr-go">Registrar traslado</button></div>');
  const leer=v=>Math.round(parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."))||0);
  function pintar(){
    const desde=$("#tr-desde").value, hacia=$("#tr-hacia").value, monto=leer($("#tr-monto").value);
    const a=state.inversiones.find(x=>x.id===desde);
    if(desde===hacia){$("#tr-aviso").textContent="Elige dos cuentas distintas.";return;}
    if(!monto){$("#tr-aviso").textContent="Escribe el monto a mover.";return;}
    $("#tr-aviso").textContent=(a?esc(a.nombre)+" bajaría a "+fmt.format(valorHoy(a)-monto)+". ":"")
      +"Tu patrimonio no cambia: la plata solo cambia de sitio.";
  }
  ["#tr-desde","#tr-hacia"].forEach(s=>$(s).onchange=pintar); $("#tr-monto").oninput=pintar; pintar();
  $("#tr-go").onclick=()=>{
    const desde=$("#tr-desde").value, hacia=$("#tr-hacia").value, monto=leer($("#tr-monto").value);
    if(!monto||desde===hacia)return;
    if(hacia===ID_EFECTIVO)billeteraEfectivo(); // la crea si aún no existe
    state.movimientos.push({id:uid(),ts:Date.now(),fecha:$("#tr-fecha").value||todayISO(),tipo:"traslado",
      desde:desde,hacia:hacia,monto:monto,descripcion:"Traslado",fuente:"manual"});
    closeModal();commit();
  };
}

// Actualizar saldo: propone el interés que la tasa predice y deja corregirlo
// con el número real del banco. Lo que sobra de la diferencia es aporte o retiro.
function actualizarSaldo(id){
  const i=state.inversiones.find(x=>x.id===id); if(!i||!esFija(i))return;
  const red=v=>esUSD(i)?Math.round(v*100)/100:Math.round(v); // en dólares los centavos cuentan
  const previsto=red(interesCausado(i)), saldoAnt=+i.saldo||0, dias=diasEntre(i.fechaSaldo);
  const registrado=red(movNetoNativo(i)); // gastos, ingresos y traslados ya anotados
  const esperado=red(saldoAnt+registrado+previsto);
  const M=v=>fmtMon(v,i);
  modal('<h2>Actualizar '+esc(i.nombre)+'</h2>'
   +'<p class="sub">Saldo confirmado: '+M(saldoAnt)+' el '+esc(i.fechaSaldo||"—")+' ('+dias+' días).</p>'
   +'<div class="panel" style="margin-bottom:14px">'
     +row2("Saldo confirmado",M(saldoAnt))
     +(registrado?row2("Movimientos registrados desde entonces",M(registrado),registrado>=0?"pos":"neg"):"")
     +(previsto?row2("Interés estimado",M(previsto),"pos"):"")
     +row2("El dashboard espera",M(esperado))
     +(esUSD(i)?'<div class="hint">En pesos a la TRM de hoy ('+fmt.format(TRM())+'): '+fmt.format(esperado*TRM())+'</div>':"")
   +'</div>'
   +'<div class="formrow">'
    +fld("Saldo real hoy",'<input class="num" id="as-saldo" inputmode="numeric" value="'+esperado+'">')
    +fld("De eso, interés",'<input class="num" id="as-interes" inputmode="numeric" value="'+previsto+'">')
   +'</div>'
   +'<div class="hint">Corrige el interés con el número que te muestre tu banco. Lo que no cuadre queda como movimiento que no habías registrado.</div>'
   +'<div class="msg warn" id="as-delta" style="margin-top:12px"></div>'
   +'<div class="acts"><button class="btn ghost" data-act="closemodal">Cancelar</button><button class="btn" id="as-go">Guardar</button></div>');
  const $s=$("#as-saldo"), $i=$("#as-interes"), $d=$("#as-delta");
  const leer=v=>red(parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."))||0);
  const minimo=esUSD(i)?0.01:1;
  function pintar(){
    const nuevo=leer($s.value), inter=leer($i.value), sinRegistrar=nuevo-saldoAnt-registrado-inter;
    $d.textContent=Math.abs(sinRegistrar)<minimo
      ? "Todo cuadra con lo registrado más el interés."
      : (sinRegistrar>0?"Sobran "+M(sinRegistrar)+": se anotan como entrada sin registrar."
                       :"Faltan "+M(-sinRegistrar)+": se anotan como salida sin registrar.");
  }
  $s.oninput=pintar; $i.oninput=pintar; pintar();
  $("#as-go").onclick=()=>{
    const nuevo=leer($s.value), inter=leer($i.value), sinRegistrar=nuevo-saldoAnt-registrado-inter;
    // El nuevo ancla absorbe todo lo anterior: los movimientos ya contados quedan
    // dentro del saldo, así que el capital sube por ellos y por lo no registrado.
    i.aportado=(+i.aportado||0)+registrado+sinRegistrar;
    // El costo en pesos sube por lo que realmente salió: lo registrado ya venía en
    // pesos, y lo no registrado se convierte a la TRM de hoy.
    if(esUSD(i))i.aportadoCOP=(+i.aportadoCOP||0)+movNeto(i.id,i.fechaSaldo,i.anclaTs)+sinRegistrar*TRM();
    i.interesAcumulado=(+i.interesAcumulado||0)+inter;
    i.saldo=nuevo; i.fechaSaldo=todayISO(); i.anclaTs=Date.now();
    closeModal(); commit();
  };
}

      etiqueta:"TRM en pesos",valor:Math.round(TRM()),ok:"Actualizar"}).then(v=>{

        if(n>0){state.config.trm=n;state.config.trmFecha=todayISO();state.config.trmConfirmada=true;commit();}
      });break;
    case"edittarj":ui.editId=a.dataset.id;ui.section="tarjetas";render();scrollTo(0,0);break;
    case"del":{const id=a.dataset.id;
      confirmar("Eliminar movimiento","Se quita del historial y se deshace su efecto sobre los saldos.","Eliminar")
        .then(ok=>{if(ok){state.movimientos=state.movimientos.filter(m=>m.id!==id);commit();}});break;}
    case"delinv":{const id=a.dataset.id, inv=state.inversiones.find(x=>x.id===id);
      confirmar("Eliminar "+(inv?inv.nombre:"posición"),"Su saldo deja de contar en tu patrimonio.","Eliminar")
        .then(ok=>{if(ok){state.inversiones=state.inversiones.filter(i=>i.id!==id);commit();}});break;}
    case"deltarj":{const t=state.tarjetas.find(x=>x.id===a.dataset.id);

      confirmar("Eliminar "+(t?t.nombre:"tarjeta"),"Los gastos que pagaste con ella quedan sin medio asignado.","Eliminar")
        .then(ok=>{if(ok){state.tarjetas=state.tarjetas.filter(x=>x.id!==id);commit();}});break;}
    case"rmimg":{const m=state.movimientos.find(x=>x.id===ui.editId);if(m){delete m.imagen;commit();}break;}

document.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f).entries());
  const kind=f.dataset.form;
  const money=v=>Math.round(parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."))||0);
  if(kind==="gasto"||kind==="ingreso"){
    const rec={fecha:d.fecha,tipo:kind,categoria:d.categoria,descripcion:(d.descripcion||"").trim(),monto:money(d.monto),medio:d.medio||undefined};
    let img=null;const file=f.querySelector('input[name="img"]');
    if(file&&file.files&&file.files[0])img=await thumb(file.files[0]).catch(()=>null);
    if(ui.editId){const m=state.movimientos.find(x=>x.id===ui.editId);Object.assign(m,rec);if(img)m.imagen=img;ui.editId=null;}
    else{rec.id=uid();rec.ts=Date.now();rec.fuente="manual";if(img)rec.imagen=img;state.movimientos.push(rec);}
    f.reset();commit();
  }else if(kind==="inv"){
    const usdRec=d.moneda==="USD";
    // decimal con signo: una pérdida es rentabilidad negativa y debe conservarse
    const dec=v=>parseFloat(String(v||"").replace(",","."))||0;
    const tasa=v=>Math.max(0,dec(v)); // una tasa E.A. o una TRM nunca son negativas
    // en dólares los centavos importan; solo se quita el punto de miles (1.500,50)
    const val=v=>usdRec?dec(String(v||"").replace(/\.(?=\d{3}\b)/g,"")):money(v);
    const base={nombre:(d.nombre||"").trim(),tipo:d.tipo,moneda:usdRec?"USD":undefined,
      nota:(d.nota||"").trim(),fechaActualizacion:todayISO()};
    let rec;
    if(d.tipo==="accion"){
      // trii muestra cantidad y precio por acción; el total lo calcula el dashboard
      const num=v=>parseFloat(String(v||"").split(".").join("").replace(",","."))||0;
      const cantidad=Math.max(num(d.cantidad)||1,0.0000001);
      const bruto=cantidad*num(d.precio);
      const actual=usdRec?Math.round(bruto*100)/100:Math.round(bruto);
      // Al crear se deduce el costo desde la rentabilidad que muestra el broker;
      // a partir de ahí el costo queda quieto y basta actualizar el valor.
      let invertido;
      if(ui.editId){invertido=val(d.montoInvertido);}
      else if(d.rentUnidad==="abs"){invertido=actual-val(d.rent);}
      else{const p=dec(d.rent);invertido=p<=-100?actual:actual/(1+p/100);} // -100% dejaría el costo en infinito
      invertido=usdRec?Math.round(invertido*100)/100:Math.round(invertido);
      rec=Object.assign(base,{cantidad:cantidad,montoInvertido:Math.max(0,invertido),valorActual:actual,
        fechaCompra:d.fechaCompra||undefined});
    }else{
      rec=Object.assign(base,{saldo:val(d.saldo),fechaSaldo:d.fechaSaldo||todayISO(),tasaEA:tasa(d.tasaEA),
          vencimiento:(d.tipo==="cdt"&&d.vencimiento)?d.vencimiento:undefined});
    }
    // pesos que realmente salieron: base para separar el rendimiento del efecto del dólar
    if(usdRec){const trmE=tasa(String(d.trmEntrada||"").replace(/\./g,"").replace(",","."))||TRM();
      rec.aportadoCOP=(d.tipo==="accion"?rec.montoInvertido:rec.saldo)*trmE;}
    if(ui.editId){
      const prev=state.inversiones.find(x=>x.id===ui.editId);
      // al editar se conserva lo ya ganado y aportado; el alta los inicializa
      Object.assign(prev,rec); delete prev.sinDato;
      if(d.tipo!=="accion"){prev.aportado=(+prev.aportado)||rec.saldo;prev.interesAcumulado=(+prev.interesAcumulado)||0;
        delete prev.montoInvertido;delete prev.valorActual;}
      else {delete prev.saldo;delete prev.fechaSaldo;delete prev.tasaEA;delete prev.vencimiento;
        delete prev.aportado;delete prev.interesAcumulado;}
      if(!usdRec){delete prev.moneda;delete prev.aportadoCOP;}
      ui.editId=null;
    }else{
      rec.id=uid();
      // Si la plata sale de una cuenta, se registra el traslado y se ancla la
      // posición nueva en ese mismo instante: así el traslado descuenta el
      // origen pero no vuelve a sumar en el destino, que ya trae su saldo.
      const origen=d.origen&&state.inversiones.find(x=>x.id===d.origen)?d.origen:"";
      const t=Date.now();
      if(d.tipo!=="accion"){rec.aportado=rec.saldo;rec.interesAcumulado=0;rec.anclaTs=t;} // el saldo inicial es capital, no ganancia
      state.inversiones.push(rec);
      if(origen){
        const enCOP=usdRec?rec.aportadoCOP:(d.tipo==="accion"?rec.montoInvertido:rec.saldo);
        if(enCOP>0)state.movimientos.push({id:uid(),ts:t,fecha:rec.fechaSaldo||rec.fechaCompra||todayISO(),
          tipo:"traslado",desde:origen,hacia:rec.id,monto:Math.round(enCOP),
          descripcion:"Apertura "+rec.nombre,fuente:"manual"});
      }
    }
    ui.invTipo=null;ui.invMoneda=null; f.reset();commit();
  }else if(kind==="tarjeta"){
    const cl=n=>Math.min(31,Math.max(1,parseInt(n,10)||1));
    const rec={nombre:(d.nombre||"").trim(),diaCorte:cl(d.diaCorte),diaPago:cl(d.diaPago),
      saldoInicial:money(d.saldoInicial),saldoSinFacturar:money(d.saldoSinFacturar)};
    if(ui.editId){Object.assign(state.tarjetas.find(t=>t.id===ui.editId),rec);ui.editId=null;}
    else state.tarjetas.push(Object.assign({id:uid(),saldo:0},rec));
    f.reset();commit();
  }
});

function pagarTarjeta(id){
  const t=state.tarjetas.find(x=>x.id===id);if(!t)return;
  const c=tarjetaCiclos(t);
  // se propone lo facturado, que es lo que el banco cobra en este corte
  const deuda=Math.max(0,Math.round(c.facturado));
  const cuentas=state.inversiones.filter(i=>i.tipo==="cuenta");
  modal('<h2>Pagar '+esc(t.nombre)+'</h2>'
   +'<p class="sub">A pagar en este corte: '+fmt.format(c.facturado)
     +(c.enCurso>0?'. Además hay '+fmt.format(c.enCurso)+' del ciclo en curso, que se pagan el próximo mes':"")+'.</p>'
   +'<div class="formrow">'
    +fld("Monto del pago",'<input class="num" id="pg-monto" inputmode="numeric" value="'+deuda+'">')
    +fld("¿De dónde sale?",'<select id="pg-desde"><option value="">Otra fuente (no descontar)</option>'
      +cuentas.map(c=>'<option value="'+c.id+'">'+esc(c.nombre)+' · '+fmt.format(valorHoy(c))+'</option>').join("")+'</select>',"grow")
   +'</div>'
   +'<div class="msg warn" id="pg-aviso" style="margin-top:12px"></div>'
   +'<div class="acts"><button class="btn ghost" data-act="closemodal">Cancelar</button><button class="btn" id="pg-go">Registrar pago</button></div>');
  const leer=v=>Math.round(parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."))||0);
  function pintar(){
    const monto=leer($("#pg-monto").value), desde=$("#pg-desde").value;
    const c=cuentas.find(x=>x.id===desde);
    const queda=deuda-monto;
    let txt=queda>0?"Quedarían "+fmt.format(queda)+" por pagar.":(queda<0?"Estás pagando "+fmt.format(-queda)+" más que el saldo.":"Deja la tarjeta en cero.");
    if(c)txt+=" "+esc(c.nombre)+" bajaría a "+fmt.format(valorHoy(c)-monto)+".";
    $("#pg-aviso").textContent=txt;
  }
  $("#pg-monto").oninput=pintar; $("#pg-desde").onchange=pintar; pintar();
  $("#pg-go").onclick=()=>{
    const monto=leer($("#pg-monto").value), desde=$("#pg-desde").value;
    if(monto<=0)return;
    // No se toca el saldo de la cuenta aquí: movNeto ya descuenta este pago.
    state.movimientos.push({id:uid(),ts:Date.now(),fecha:todayISO(),tipo:"pago_tarjeta",medio:id,desde:desde||undefined,
      descripcion:"Pago "+t.nombre,monto:monto,fuente:"manual"});
    closeModal();commit();
  };
}

// ---- image thumb ----
function thumb(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const M=900,sc=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",0.6));
  };img.src=r.result;};
  r.readAsDataURL(file);
});}
function openImg(src){modal('<h2>Recibo</h2><img src="'+src+'" style="max-width:100%;border-radius:8px"><div class="acts"><button class="btn ghost" data-act="closemodal">Cerrar</button></div>');}

async function doExport(){
  const data=JSON.stringify(state,null,2), name="finanzas-"+todayISO()+".json";
  if(dlNS===undefined)dlNS=await cap("downloads");
  if(dlNS){try{await dlNS.save({filename:name,data:data});return;}catch(err){if(err&&err.code==="declined")return;}}
  modal('<h2>Exportar</h2><p class="sub">Copia este JSON y guárdalo como respaldo.</p><textarea style="width:100%;height:260px;font-family:var(--mono);font-size:.8rem" readonly>'+esc(data)+'</textarea><div class="acts"><button class="btn ghost" data-act="closemodal">Cerrar</button></div>');
}
function doImport(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=()=>{const fl=inp.files[0];if(!fl)return;const r=new FileReader();
    r.onload=()=>{try{const raw=JSON.parse(r.result);
      if(!Array.isArray(raw.movimientos))throw 0;
      confirmar("Importar respaldo","Esto reemplaza todos los datos actuales por los del archivo.","Reemplazar").then(ok=>{
        if(!ok)return;
        state=Object.assign(defaults(),raw);
        state.config=Object.assign(defaults().config,raw.config||{});
        state.tarjetas||=[];state.inversiones||=[];state.movimientos||=[];
        migrarInversiones(); ui.editId=null;commit();
      });
    }catch(e){avisar("Archivo no válido","Ese archivo no parece un respaldo de este dashboard.");}};
    r.readAsText(fl);};
  inp.click();
}

function modal(html,alCerrar){closeModal();alCerrarModal=alCerrar||null;
  const bg=document.createElement("div");bg.className="modalbg";bg.id="modalbg";
  bg.innerHTML='<div class="modal">'+html+'</div>';
  bg.addEventListener("click",e=>{if(e.target===bg)closeModal();});
  document.body.appendChild(bg);}
function closeModal(){const m=$("#modalbg");if(m)m.remove();
  const cb=alCerrarModal;alCerrarModal=null;if(cb)cb();}

// El visor de Artifacts corre la página en un marco restringido: prompt,
// confirm y alert se ignoran en silencio. Estos los reemplazan.
function pedirValor(o){
  return new Promise(res=>{
    const cerrar=v=>{alCerrarModal=null;closeModal();res(v);};
    modal('<h2>'+esc(o.titulo)+'</h2>'+(o.texto?'<p class="sub">'+esc(o.texto)+'</p>':"")
     +'<div class="formrow">'+fld(o.etiqueta||"Valor",'<input class="num" id="dlg-in" value="'+esc(o.valor==null?"":o.valor)+'">',"grow")+'</div>'
     +'<div class="acts"><button class="btn ghost" id="dlg-no">Cancelar</button>'
     +'<button class="btn" id="dlg-si">'+esc(o.ok||"Guardar")+'</button></div>', ()=>res(null));
    const inp=$("#dlg-in"); if(inp){inp.focus();inp.select();
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();cerrar(inp.value);}};}
    $("#dlg-no").onclick=()=>cerrar(null);
    $("#dlg-si").onclick=()=>cerrar(inp?inp.value:null);
  });
}
function confirmar(titulo,texto,ok){
  return new Promise(res=>{
    const cerrar=v=>{alCerrarModal=null;closeModal();res(v);};
    modal('<h2>'+esc(titulo)+'</h2>'+(texto?'<p class="sub">'+esc(texto)+'</p>':"")
     +'<div class="acts"><button class="btn ghost" id="dlg-no">Cancelar</button>'
     +'<button class="btn" id="dlg-si">'+esc(ok||"Confirmar")+'</button></div>', ()=>res(false));
    $("#dlg-no").onclick=()=>cerrar(false);
    $("#dlg-si").onclick=()=>cerrar(true);
  });
}
function avisar(titulo,texto){
  modal('<h2>'+esc(titulo)+'</h2><p class="sub">'+esc(texto)+'</p>'
   +'<div class="acts"><button class="btn" data-act="closemodal">Cerrar</button></div>');
}

// ---- Gmail sync ----
const RECV_SENDERS=/rappicard\.co|trii\.co|accivalores\.com|bancolombia|davivienda|nu\.com\.co|scotiabank/i;
function parseAmountCOP(txt){
  const ms=[...String(txt).matchAll(/\$\s?(\d{1,3}(?:\.\d{3})+(?:,\d{2})?|\d+(?:,\d{2})?)/g)].map(m=>{
    let s=m[1];if(s.includes(".")&&s.includes(","))s=s.replace(/\./g,"").replace(",",".");
    else if(/,\d{2}$/.test(s))s=s.replace(",",".");else s=s.replace(/,/g,"");
    return parseFloat(s);
  }).filter(n=>n>0);
  return ms.length?Math.round(Math.max(...ms)):0;
}
function guessCat(t){t=(t||"").toLowerCase();
  const map=[["Suscripciones",/netflix|spotify|hbo|disney|membres|suscrip|prime video|icloud|google one/],
   ["Transporte",/uber|taxi|didi|cabify|gasolin|peaje|transmi/],["Mercado",/rappi|mercado|exito|carulla|d1|ara|jumbo|olimpica|supermerc/],
   ["Ocio",/airbnb|hotel|cine|restaurante|bar |viaje|vuelo|avianca|latam/],
   ["Servicios",/energia|acueduct|gas natural|claro|movistar|tigo|internet|factura/],["Salud",/farmacia|drogueria|eps|medic|cruz verde/],["Vivienda",/arriendo|administraci[oó]n|hipotec/]];
  for(const[c,re]of map)if(re.test(t))return c;return"Otros";
}
async function gmailSync(kind){
  if(!mcpNS){modal('<h2>Gmail</h2><div class="msg warn">Conecta Gmail en claude.ai → Configuración → Conectores y recarga.</div><div class="acts"><button class="btn ghost" data-act="closemodal">Cerrar</button></div>');return;}
  modal('<h2>Sincronizar con Gmail</h2><p class="sub">Buscando compras recientes…</p>');
  const q='(category:purchases OR from:rappicard.co OR from:trii.co OR from:accivalores.com OR subject:(recibo OR factura OR comprobante OR "resumen de transacción" OR "pago exitoso")) newer_than:45d -in:draft';
  let threads;
  try{
    const res=await mcpNS.callTool("Gmail","search_threads",{query:q,pageSize:40});
    threads=((res&&res.payload)||{}).threads||[];
  }catch(err){return gmailErr(err);}
  // build candidates
  const seen=new Set(state.movimientos.filter(m=>m.gmailMsgId).map(m=>m.gmailMsgId));
  let cands=[];
  for(const th of threads){
    const m=(th.messages||[])[0];if(!m)continue;
    if(seen.has(m.id))continue;
    const sender=m.sender||"", subj=m.subject||"", snip=m.snippet||"";
    let amount=parseAmountCOP(subj+" "+snip), body="";
    if(!amount&&RECV_SENDERS.test(sender)&&cands.filter(c=>c._fetched).length<8){
      try{const r=await mcpNS.callTool("Gmail","get_thread",{threadId:th.id,messageFormat:"PLAIN_TEXT"});
        body=(((r&&r.payload)||{}).messages||[{}])[0].plaintextBody||"";amount=parseAmountCOP(body);
      }catch(e){}
    }
    let desc=subj.replace(/rappicard|resumen de transacci[oó]n/gi,"").replace(/[-|–]/g," ").trim()||sender.split("<")[0].trim();
    const rc=/rappicard\.co/i.test(sender);
    let medio="";
    if(rc){const cm=(body||snip).match(/Comercio\s*\|?\s*([A-Za-z0-9ÁÉÍÓÚÑñ .*&-]{2,40}?)\s*(?:\||Fecha|No\.|M[eé]todo)/i);if(cm)desc=cm[1].trim();
      const t=state.tarjetas.find(x=>/rappi/i.test(x.nombre));if(t)medio=t.id;}
    const dm=(body||snip+" "+subj).match(/(\d{4}-\d{2}-\d{2})/);
    const fecha=dm?dm[1]:(m.date?String(m.date).slice(0,10):todayISO());
    cands.push({gmailMsgId:m.id,fecha,descripcion:desc.slice(0,60),monto:amount,categoria:kind==="ingreso"?"Otros":guessCat(desc+" "+snip+" "+sender),
      medio:medio,sender:sender.replace(/</g," <"),confident:amount>0,_fetched:!!body});
  }
  if(!cands.length){modal('<h2>Gmail</h2><div class="msg warn">No hay compras nuevas sin importar en los últimos 45 días.</div><div class="acts"><button class="btn ghost" data-act="closemodal">Cerrar</button></div>');return;}
  renderReview(cands,kind);
}
function gmailErr(err){
  const code=(err&&err.code)||"";
  const m={needs_reauth:"La conexión con Gmail expiró. Reconéctala en claude.ai → Conectores.",
    server_not_connected:"Agrega Gmail en claude.ai → Configuración → Conectores.",
    selection_required:"Tienes varias cuentas de Gmail; elige una cuando claude.ai lo pida y reintenta.",
    tool_error:"Gmail rechazó la búsqueda: "+esc((err&&err.message)||""),
    blocked_by_policy:"Tu organización bloquea el acceso a Gmail desde páginas."}[code]
    ||("No se pudo consultar Gmail ("+esc(code||"error")+").");
  modal('<h2>Gmail</h2><div class="msg err">'+m+'</div><div class="acts"><button class="btn ghost" data-act="closemodal">Cerrar</button></div>');
}
function renderReview(cands,kind){
  const rows=cands.map((c,i)=>'<tr data-i="'+i+'">'
    +'<td><input type="checkbox" class="rv-ck"'+(c.confident?" checked":"")+'></td>'
    +'<td><input class="rv-f" type="date" value="'+esc(c.fecha)+'"></td>'
    +'<td><input class="rv-d" value="'+esc(c.descripcion)+'"></td>'
    +'<td><select class="rv-c">'+(kind==="ingreso"?["Salario","Negocio","Dividendos","Intereses","Freelance","Otros"]:CATS).map(x=>'<option'+(x===c.categoria?" selected":"")+'>'+x+'</option>').join("")+'</select></td>'
    +'<td><select class="rv-m">'+medioOptions(c.medio,kind==="ingreso")+'</select></td>'
    +'<td><input class="rv-a amt" inputmode="numeric" value="'+(c.monto||"")+'"></td>'
    +'<td style="color:var(--ink-3);font-size:.75rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(c.sender)+'">'+esc(c.sender)+'</td></tr>').join("");
  modal('<h2>Revisar '+cands.length+' movimientos de Gmail</h2>'
   +'<p class="sub">Desmarca lo que no quieras, ajusta montos y categorías. Nada se guarda hasta confirmar.</p>'
   +'<div style="overflow:auto"><table class="rev"><thead><tr><th></th><th>Fecha</th><th>Descripción</th><th>Categoría</th>'
   +'<th>'+(kind==="gasto"?"Sale de":"Entra a")+'</th><th class="r">Monto</th><th>Correo</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="acts"><button class="btn ghost" data-act="closemodal">Cancelar</button><button class="btn" id="rv-go">Importar seleccionados</button></div>');
  $("#rv-go").onclick=()=>{
    let n=0;
    $("#modalbg").querySelectorAll("tbody tr").forEach(tr=>{
      if(!tr.querySelector(".rv-ck").checked)return;
      const c=cands[+tr.dataset.i];
      const monto=Math.round(parseFloat(String(tr.querySelector(".rv-a").value).replace(/[^\d]/g,""))||0);
      if(monto<=0)return;
      const rec={id:uid(),ts:Date.now(),tipo:kind,fecha:tr.querySelector(".rv-f").value,descripcion:tr.querySelector(".rv-d").value.trim(),
        categoria:tr.querySelector(".rv-c").value,monto:monto,fuente:"gmail",gmailMsgId:c.gmailMsgId};
      rec.medio=(tr.querySelector(".rv-m")||{}).value||undefined;
      state.movimientos.push(rec);n++;
    });
    closeModal();commit();
    if(n)setTimeout(()=>avisar("Listo",n+(n===1?" movimiento importado.":" movimientos importados.")),60);
  };
}

// ---- boot ----
load();render();initCaps();
})();
</script>
